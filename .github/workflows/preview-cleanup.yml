name: Preview cleanup

# A closed pull request (merged or not) loses its Cloudflare Worker Preview, so no stale copy of the site stays online.
# It only ever deletes pr-<number>: production is a deployment of the Worker, not a Preview, and is never touched.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  delete:
    name: Delete the Preview
    # the same pull requests as the preview job of ci.yml: the others never had a Preview
    if: >-
      !github.event.repository.is_template
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      # pnpm's version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Delete pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          case "$PREVIEW_NAME" in pr-[0-9]*) ;; *) echo "::error::refusing to delete '$PREVIEW_NAME'"; exit 1 ;; esac
          if out=$(pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation 2>&1); then
            printf '%s\n' "$out"
            echo "deleted $PREVIEW_NAME"
          elif grep -qiE 'not found|does not exist|no preview' <<<"$out"; then
            printf '%s\n' "$out"
            echo "no Preview named $PREVIEW_NAME (never created, or already deleted)"
          else
            printf '%s\n' "$out" >&2
            exit 1
          fi

      - name: Mark the Preview comment as removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- cf-worker-preview -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -z "$id" ]; then echo "no Preview comment to update"; exit 0; fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$marker
          ### Preview

          Deleted: the pull request is closed." >/dev/null
          echo "updated comment $id"
