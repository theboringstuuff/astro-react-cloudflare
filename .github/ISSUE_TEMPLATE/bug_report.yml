name: Bug report
description: Something on the site is broken or looks wrong.
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page, for example /en/about/
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari / Windows, Chrome 141
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Tap …
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
